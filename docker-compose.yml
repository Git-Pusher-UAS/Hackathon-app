services:
  db:
    image: postgres:17-alpine
    container_name: hackathon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sai
    ports:
      # 5433 en el host porque el 5432 ya lo usa otro contenedor (backend_postgres)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sai" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    container_name: hackathon-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro de la red de compose el host es el nombre del servicio, no localhost.
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
      PORT: "3001"
    ports:
      - "3001:3001"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000  /health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Servicio de un solo uso para crear esquemas, tablas y vistas.
  #   docker compose --profile tools run --rm migrate
  migrate:
    profiles: [ "tools" ]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    container_name: hackathon-migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
    entrypoint: [ "/app/migrate" ]
    restart: "no"

  # Bootstrap del usuario/rol/permisos iniciales (requiere migraciones hechas).
  #   docker compose --profile tools run --rm seed
  seed:
    profiles: [ "tools" ]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: dev
    container_name: hackathon-seed
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_SSLMODE: disable
    entrypoint: [ "/app/seed" ]
    restart: "no"

volumes:
  pgdata:
