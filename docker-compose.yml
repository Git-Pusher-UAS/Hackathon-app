services:
  db:
    image: postgres:17-alpine
    container_name: hackathon-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sai
    ports:
      # 5433 en el host porque el 5432 ya lo usa otro contenedor (backend_postgres)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
