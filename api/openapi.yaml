          type: string
        closedAt:
          type: string
        createdAt:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoExpediente'
        id:
          type: string
        origenContacto:
          $ref: '#/components/schemas/OrigenContacto'
        tipoCasoId:
          type: string
        updatedAt:
          type: string
        versionTag:
          type: string
      type: object
    CasefileTimelineItem:
      properties:
        actorId:
          type: string
        departamentoId:
          type: string
        id:
          type: string
        ocurridoEn:
          type: string
