      type: object
    InstitutionalContactResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/InstitutionalContactContact'
          type: array
        version:
          type: string
      type: object
    LoginRequest:
      properties:
        password:
          example: admin123
          type: string
        usuario:
          example: admin
          type: string
      type: object
    ModalidadConsentimiento:
      enum:
        - presencial
        - digital
      type: string
      x-enum-varnames:
        - ModalidadPresencial
        - ModalidadDigital
    NivelAlerta:
      enum:
        - media
        - alta
      type: string
      x-enum-varnames:
        - AlertaMedia
        - AlertaAlta
    NoteSyncNote:
      properties:
        corrigeNotaId:
          type: string
        departmentId:
          type: string
        ocurridoEn:
          type: string
        operationId:
          example: 7d1f4c1e-5d9a-4f4f-8a43-2f3b4c5d6e7f
          type: string
        recordId:
          type: string
        texto:
          type: string
      type: object
    NoteSyncRequest:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/NoteSyncNote'
          type: array
      type: object
    NoteSyncResponse:
      properties:
        results:
