# GENERADO: no editar a mano. Fuente: anotaciones swag -> docs/swagger.json -> go run ./cmd/openapi
components:
  schemas:
    AnalyticsHeatmap:
      properties:
        generadoEn:
          type: string
        items:
          items:
            $ref: '#/components/schemas/AnalyticsHeatmapCell'
          type: array
        supresionK:
          example: 5
          type: integer
      type: object
    AnalyticsHeatmapCell:
      properties:
        conteo:
          type: integer
        nivel:
          description: bajo | medio | alto
          example: medio
          type: string
        periodo:
          type: string
        sectorId:
          type: string
        suprimido:
          type: boolean
        tipoCasoId:
          type: string
      type: object
    AnalyticsSummary:
      properties:
        generadoEn:
          type: string
        items:
          items:
            $ref: '#/components/schemas/AnalyticsSummaryRow'
          type: array
        supresionK:
          example: 5
          type: integer
      type: object
    AnalyticsSummaryRow:
      properties:
        episodios:
          type: integer
        periodo:
          description: primer día del mes
          type: string
        personas:
          type: integer
        sectorId:
          type: string
        suprimido:
          type: boolean
        tipoCasoId:
          type: string
      type: object
    AuditLogAlert:
      properties:
