        departamentoId:
          type: string
        id:
          type: string
        nombreLaboral:
          type: string
        permisos:
          items:
            type: string
          type: array
        requiereCambioPassword:
          type: boolean
        rol:
          type: string
        usuario:
          type: string
      type: object
    CasefileAssignRequest:
