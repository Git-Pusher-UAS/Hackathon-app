          type: string
      type: object
    UserCreateRequest:
      properties:
        departamentoId:
          type: string
        nombreLaboral:
          type: string
        password:
          type: string
        rol:
          type: string
        usuario:
          type: string
      type: object
    UserMFAResetRequest:
      properties:
        motivo:
          type: string
        verificacionPresencial:
          type: boolean
      type: object
    UserMeResponse:
      properties:
        actor:
          $ref: '#/components/schemas/UserActor'
        expiresAt:
          type: string
        idleExpiresAt:
          type: string
      type: object
    UserPageSessionSummary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserSessionSummary'
          type: array
        nextCursor:
          type: string
      type: object
    UserPageStaffSummary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserStaffSummary'
          type: array
        nextCursor:
          type: string
      type: object
    UserRevokeSessionsRequest:
      properties:
        motivo:
          type: string
      type: object
    UserSessionSummary:
      properties:
        createdAt:
          type: string
        current:
          type: boolean
        deviceLabel:
          type: string
        expiresAt:
          type: string
        id:
          type: string
        lastActivityAt:
          type: string
      type: object
    UserStaffSummary:
      properties:
        departamentoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPersonal'
        id:
          type: string
        nombreLaboral:
          type: string
        rol:
          type: string
        usuario:
          type: string
        versionTag:
          type: string
      type: object
    UserUpdateRequest:
      properties:
        departamentoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPersonal'
        rol:
          type: string
      type: object
    VerifyMFARequest:
      properties:
        challenge_token:
          type: string
        code:
          example: "123456"
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: JWT de POST /auth/login. Las escrituras exigen además X-CSRF-Token (csrf_token del login o GET /auth/csrf-token).
      scheme: bearer
      type: http
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
openapi: 3.0.3
paths:
  /analytics/heatmap:
    get:
      description: Nivel (bajo, medio, alto) y conteo por sector, tipo de caso y mes, sin puntos domiciliarios. Sin filtros puede haber varias filas por sector (una por mes y tipo). Requiere analytics.read. API-038.
      parameters:
        - description: Mes en formato YYYY-MM
          in: query
          name: period
          schema:
            type: string
        - description: UUID del tipo de caso
          in: query
          name: caseTypeId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsHeatmap'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Mapa de calor por sector
      tags:
        - analytics
  /analytics/summary:
    get:
      description: Personas y episodios por sector, tipo de caso y mes. Las celdas con menos de 5 casos llegan en null con suprimido=true. Requiere analytics.read. API-037.
      parameters:
        - description: Desde (RFC 3339), sobre el mes del episodio
          in: query
          name: from
          schema:
            type: string
        - description: Hasta (RFC 3339, exclusivo)
          in: query
          name: to
          schema:
            type: string
        - description: UUID del sector
          in: query
          name: sectorId
          schema:
            type: string
        - description: UUID del tipo de caso
          in: query
          name: caseTypeId
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Resumen de indicadores
      tags:
        - analytics
  /audit-alerts:
    get:
      description: Alertas generadas por volumen inusual de accesos. La consulta queda auditada. Requiere el permiso audit.read. API-036.
      parameters:
        - description: abierta | revisada
