      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
    EstadoAlerta:
      enum:
        - abierta
        - revisada
      type: string
      x-enum-varnames:
        - AlertaAbierta
        - AlertaRevisada
    EstadoCanalizacion:
      enum:
        - pendiente
        - aceptada
        - rechazada
        - cancelada
        - completada
      type: string
      x-enum-varnames:
        - CanalizacionPendiente
        - CanalizacionAceptada
        - CanalizacionRechazada
        - CanalizacionCancelada
        - CanalizacionCompletada
    EstadoExpediente:
