        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserSessionSummary'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - BearerAuth: []
      summary: Listar sesiones propias
      tags:
        - users
  /users/me/sessions/{sessionId}:
    delete:
      description: Revoca una sesión de la cuenta autenticada. No permite revocar la sesión actual.
      parameters:
        - description: ID de la sesión
          in: path
          name: sessionId
          required: true
          schema:
            type: string
        - description: Token CSRF de la sesión (GET /api/v1/auth/csrf-token)
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Sin contenido
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Revocar sesión propia
      tags:
        - users
servers:
  - description: Base path del contrato
    url: /api/v1
