  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: JWT de POST /auth/login. Las escrituras exigen además X-CSRF-Token (csrf_token del login o GET /auth/csrf-token).
      scheme: bearer
      type: http
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
openapi: 3.0.3
paths:
  /auth/csrf-token:
    get:
      description: Genera un token CSRF nuevo para la sesión e invalida el anterior. La pantalla lo pide al recargar con una sesión viva.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCSRFResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - BearerAuth: []
      summary: Obtener token CSRF
      tags:
        - auth
  /auth/login:
    post:
      description: 'Valida usuario y contraseña con límite de 5 fallos en 15 min. Responde siempre 202 con un reto: next=totp si la cuenta ya tiene segundo factor, next=enroll si debe configurarlo. Nadie entra sin segundo factor. Pública, sin CSRF.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: Credenciales
        required: true
        x-originalParamName: request
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_credentials (no revela si el usuario existe)
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: account_suspended
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: too_many_attempts, con Retry-After
      summary: Iniciar sesión (paso 1)
      tags:
        - auth
  /auth/logout:
    post:
      description: Revoca la sesión actual y expira la cookie sai_staff (Max-Age=0). Es idempotente.
      parameters:
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Sin contenido
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: csrf_invalid
      security:
        - BearerAuth: []
      summary: Cerrar sesión
      tags:
        - auth
  /auth/me:
    get:
      description: Misma información que el campo usuario de la sesión. El frontend usa GET /users/me.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUsuarioInfo'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - BearerAuth: []
      summary: Cuenta autenticada (legado)
      tags:
        - auth
  /auth/mfa/enrollments:
    post:
      description: Con el challengeId de un login con next=enroll genera el secreto TOTP. otpauthUri se muestra una sola vez; después se confirma con POST /auth/mfa/verify enviando enrollmentId. Pública, sin CSRF.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollMFARequest'
        description: Reto del login
        required: true
        x-originalParamName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnrollmentResult'
          description: Created
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: mfa_already_enrolled
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: challenge_expired
      summary: Configurar segundo factor
      tags:
        - auth
  /auth/mfa/verify:
    post:
      description: Valida el código del reto. Si el reto es de enrolamiento, enrollmentId es obligatorio y activa el segundo factor. Responde la sesión y pone la cookie sai_staff (HttpOnly, Secure, SameSite=Strict, Path=/api). El csrfToken se guarda solo en memoria. Pública, sin CSRF.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMFARequest'
        description: Reto y código
        required: true
        x-originalParamName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: OK
          headers:
            Set-Cookie:
              description: sai_staff=<jwt>; HttpOnly; Secure; SameSite=Strict; Path=/api
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_code
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: challenge_expired
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: too_many_attempts
      summary: Verificar segundo factor (paso 2)
      tags:
        - auth
  /case-files:
    get:
      description: Obtiene una página de expedientes filtrable por estado y alias.
      parameters:
        - description: Tamaño de página (1-100, default 20)
          in: query
          name: limit
          schema:
            type: integer
        - description: Cursor de paginación
          in: query
          name: cursor
          schema:
            type: string
        - description: Estado del expediente
          in: query
          name: estado
          schema:
            type: string
        - description: Alias de búsqueda
          in: query
          name: alias
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasefilePageSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Listar expedientes
      tags:
        - case-files
    post:
      description: Crea un expediente nuevo con Idempotency-Key (X-Operation-Id como alias). Repetir la clave en 24 h devuelve la misma respuesta; con otro cuerpo responde 409 idempotency_mismatch.
      parameters:
        - description: UUID de operación idempotente
          in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasefileCreateRequest'
        description: Datos del expediente
        required: true
        x-originalParamName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasefileSummary'
          description: Created
          headers:
            ETag:
              description: Versión actual del recurso
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Crear expediente
      tags:
        - case-files
  /case-files/{recordId}:
    get:
      description: Devuelve los datos de un expediente por recordId y su cabecera ETag.
      parameters:
