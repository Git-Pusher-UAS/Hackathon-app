        - PersonalSuspendido
    EstadoSolicitudVinculacion:
      enum:
        - pendiente
        - aprobada
        - rechazada
      type: string
      x-enum-varnames:
        - SolicitudPendiente
        - SolicitudAprobada
        - SolicitudRechazada
    HealthResponse:
