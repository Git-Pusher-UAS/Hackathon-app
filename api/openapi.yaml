# GENERADO: no editar a mano. Fuente: anotaciones swag -> docs/swagger.json -> go run ./cmd/openapi
components:
  schemas:
    AuthCSRFResult:
      properties:
        csrfToken:
          type: string
      type: object
    AuthChallenge:
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
        next:
          enum:
            - totp
            - enroll
          type: string
      type: object
    AuthEnrollmentResult:
      properties:
        enrollmentId:
          type: string
        otpauthUri:
          type: string
      type: object
    AuthSession:
      properties:
        csrfToken:
          type: string
        expiresAt:
          type: string
        idleExpiresAt:
          type: string
        usuario:
          $ref: '#/components/schemas/AuthUsuarioInfo'
      type: object
    AuthUsuarioInfo:
