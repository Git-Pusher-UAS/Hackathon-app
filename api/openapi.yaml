          type: string
        ventanaInicio:
          type: string
      type: object
    AuditLogAlertPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogAlert'
          type: array
        nextCursor:
          type: string
      type: object
    AuditLogEntry:
      properties:
        accion:
          example: casefile.notes.create
          type: string
        actorId:
          type: string
        actorUsuario:
          type: string
        id:
          type: string
