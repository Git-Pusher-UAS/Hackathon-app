# GENERADO: no editar a mano. Fuente: anotaciones swag -> docs/swagger.json -> go run ./cmd/openapi
components:
  schemas:
    ActivationRequest:
      properties:
        codigo:
          example: K7P2-9QX4
          type: string
        password:
          type: string
        usuario:
          example: mperez
          type: string
      type: object
    AnalyticsCelda:
      properties:
        ageb:
          example: "2501000010123"
          type: string
        nivel:
          description: 1..5 o "suprimido"
          example: "3"
          type: string
      type: object
    AnalyticsHeatmap:
      properties:
        corte:
          type: string
        sectores:
          items:
            $ref: '#/components/schemas/AnalyticsCelda'
          type: array
      type: object
    AnalyticsIndicador:
      properties:
        clave:
          example: abiertos
          type: string
        detalle:
          example: +12 vs. periodo anterior
          type: string
        suprimido:
          type: boolean
        titulo:
          example: Expedientes abiertos
          type: string
        valor:
          example: 128
          type: integer
      type: object
    AnalyticsSerie:
      properties:
        etiqueta:
          example: 2026-06
          type: string
        valor:
          example: 18
          type: integer
      type: object
    AnalyticsSummary:
      properties:
        corte:
          type: string
        indicadores:
          items:
            $ref: '#/components/schemas/AnalyticsIndicador'
          type: array
        metodologia:
          type: string
        porArea:
          items:
            $ref: '#/components/schemas/AnalyticsSerie'
          type: array
        porMes:
          items:
            $ref: '#/components/schemas/AnalyticsSerie'
          type: array
        porOrigen:
          items:
            $ref: '#/components/schemas/AnalyticsSerie'
          type: array
      type: object
    AuditLogActor:
      properties:
        id:
          type: string
        nombreLaboral:
          type: string
      type: object
    AuditLogEntry:
      properties:
        accion:
          example: casefile.disclose.telefono
          type: string
        actor:
          allOf:
            - $ref: '#/components/schemas/AuditLogActor'
          description: null en acciones anónimas
        detalle:
          example: 'Reveló teléfono. Motivo: Contacto de seguimiento'
          type: string
        expedienteId:
          type: string
        fecha:
          type: string
        id:
          type: string
        requestId:
          type: string
        resultado:
          $ref: '#/components/schemas/ResultadoAuditoria'
        rol:
          type: string
      type: object
    AuditLogPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AuditLogEntry'
          type: array
        nextCursor:
          type: string
      type: object
    AuthCSRFResult:
      properties:
        csrfToken:
          type: string
      type: object
    AuthChallenge:
      properties:
        challengeId:
          type: string
        expiresAt:
          type: string
        next:
          enum:
            - totp
            - enroll
          type: string
      type: object
    AuthEnrollmentResult:
      properties:
        enrollmentId:
          type: string
        otpauthUri:
          type: string
      type: object
    AuthSession:
      properties:
        csrfToken:
          type: string
        expiresAt:
          type: string
        idleExpiresAt:
          type: string
        usuario:
          $ref: '#/components/schemas/AuthUsuarioInfo'
      type: object
    AuthUsuarioInfo:
      properties:
        departamentoId:
          type: string
        id:
          type: string
        nombreLaboral:
          type: string
        permisos:
          items:
            type: string
          type: array
        requiereCambioPassword:
          type: boolean
        rol:
          type: string
        usuario:
          type: string
      type: object
    CaseAccessRequestCreateRequest:
      properties:
        linkToken:
          example: lt_9f...
          type: string
        motivo:
          example: La persona acudió hoy y pide atención psicológica
          type: string
      type: object
    CaseAccessRequestCreated:
      properties:
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoSolicitudVinculacion'
          example: pendiente
        requestId:
          type: string
      type: object
    CaseAccessRequestItem:
      properties:
        departamento:
          type: string
        departamentoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoSolicitudVinculacion'
        expedienteAlias:
          type: string
        expedienteId:
          type: string
        fecha:
          type: string
        id:
          type: string
        motivo:
          type: string
        solicitante:
          $ref: '#/components/schemas/CaseAccessRequestSolicitante'
      type: object
    CaseAccessRequestPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CaseAccessRequestItem'
          type: array
        nextCursor:
          type: string
      type: object
    CaseAccessRequestRejectRequest:
      properties:
        motivo:
          example: La atención la lleva otra área
          type: string
      type: object
    CaseAccessRequestSolicitante:
      properties:
        id:
          type: string
        nombreLaboral:
          type: string
      type: object
    CasefileAssignRequest:
      properties:
        departamentoId:
          type: string
        motivo:
          type: string
        personalId:
          type: string
        solicitudId:
          description: SolicitudID aprueba esa solicitud de acceso en la misma transacción.
          type: string
      type: object
    CasefileAssignmentView:
      properties:
        departamentoId:
          type: string
        fin:
          type: string
        id:
          type: string
        inicio:
          type: string
        personalId:
          type: string
      type: object
    CasefileConsentInput:
      properties:
        capturadoEn:
          type: string
        decision:
          $ref: '#/components/schemas/DecisionConsentimiento'
        modalidad:
          $ref: '#/components/schemas/ModalidadConsentimiento'
        propositoIds:
          items:
            type: string
          type: array
      type: object
    CasefileConsentView:
      properties:
        consentId:
          type: string
        decididoEn:
          type: string
        decision:
          $ref: '#/components/schemas/DecisionConsentimiento'
        propositoId:
          type: string
        revocado:
          type: boolean
        revocadoEn:
          type: string
        vigente:
          type: boolean
      type: object
    CasefileCreateRequest:
      properties:
        alias:
          type: string
        consentimiento:
          $ref: '#/components/schemas/CasefileConsentInput'
        curp:
          type: string
        domicilio:
          type: string
        fechaNacimiento:
          description: YYYY-MM-DD
          type: string
        institucionOrigenId:
          type: string
        nombre:
          type: string
        origenContacto:
          $ref: '#/components/schemas/OrigenContacto'
        sectorId:
          type: string
        telefono:
          type: string
        tipoCasoId:
          type: string
      type: object
    CasefileDetail:
      properties:
        alias:
          type: string
        areas:
          description: Areas son los códigos de los departamentos con asignación vigente.
          items:
            type: string
          type: array
        closedAt:
          type: string
        createdAt:
          type: string
        edad:
          example: 36
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoExpediente'
        id:
          type: string
        ocultos:
          $ref: '#/components/schemas/CasefileOcultos'
        origenContacto:
          $ref: '#/components/schemas/OrigenContacto'
        sector:
          example: Sector 12
          type: string
        tipoCasoId:
          type: string
        updatedAt:
          type: string
        versionTag:
          type: string
      type: object
    CasefileDisclosureRequest:
      properties:
        campo:
          enum:
            - nombre
            - curp
            - fechaNacimiento
            - telefono
            - domicilio
          type: string
        motivo:
          description: 10 a 500 caracteres
          example: Contacto de seguimiento
          type: string
      type: object
    CasefileDisclosureResponse:
      properties:
        campo:
          type: string
        valor:
          type: string
      type: object
    CasefileDuplicateCheckRequest:
      properties:
        curp:
          type: string
      type: object
    CasefileDuplicateCheckResponse:
      properties:
        department:
          description: |-
            Solo si exists: el área que lleva el caso y un token de un solo uso
            (30 min) para POST /case-access-requests sin volver a enviar la CURP.
          example: Trabajo social
          type: string
        exists:
          type: boolean
        linkExpiresAt:
          type: string
        linkToken:
          example: lt_9f...
          type: string
      type: object
    CasefileNoteCreateRequest:
      properties:
        corrigeNotaId:
          type: string
        ocurridoEn:
          type: string
        texto:
          type: string
      type: object
    CasefileNoteView:
      properties:
        autor:
          description: nombre laboral
          example: Ana Castro
          type: string
        autorId:
          type: string
        corrigeNotaId:
          type: string
        createdAt:
          type: string
        episodioId:
          type: string
        id:
          type: string
        ocurridoEn:
          type: string
        texto:
          type: string
      type: object
    CasefileOcultos:
      properties:
        curp:
          example: ••••••••••••••••07
          type: string
        domicilio:
          example: Col. •••••
          type: string
        nombre:
          example: N•••• A•••••
          type: string
        telefono:
          example: •• •••• 81
          type: string
      type: object
    CasefilePageNoteView:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CasefileNoteView'
          type: array
        nextCursor:
          type: string
      type: object
    CasefilePageSummary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CasefileSummary'
          type: array
        nextCursor:
          type: string
      type: object
    CasefilePageTimelineItem:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CasefileTimelineItem'
          type: array
        nextCursor:
          type: string
      type: object
    CasefileReferralCreateRequest:
      properties:
        destinoId:
          description: departamento (interna)
          type: string
        institucionId:
          description: institución (externa)
          type: string
        resumen:
          type: string
        tipo:
          description: interna por defecto
          enum:
            - interna
            - externa
          type: string
      type: object
    CasefileReferralView:
      properties:
        createdAt:
          type: string
        destinoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoCanalizacion'
        expedienteId:
          type: string
        id:
          type: string
        institucionId:
          type: string
        origenId:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCanalizacion'
        versionTag:
          type: string
      type: object
    CasefileRevokeConsentRequest:
      properties:
        motivo:
          type: string
        propositoIds:
          items:
            type: string
          type: array
      type: object
    CasefileSummary:
      properties:
        alias:
          type: string
        areas:
          description: Areas son los códigos de los departamentos con asignación vigente.
          items:
            type: string
          type: array
        closedAt:
          type: string
        createdAt:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoExpediente'
        id:
          type: string
        origenContacto:
          $ref: '#/components/schemas/OrigenContacto'
        tipoCasoId:
          type: string
        updatedAt:
          type: string
        versionTag:
          type: string
      type: object
    CasefileTimelineItem:
      properties:
        actorId:
          type: string
        departamentoId:
          type: string
        id:
          type: string
        ocurridoEn:
          type: string
        resumen:
          type: string
        tipo:
          type: string
      type: object
    CasefileUpdateRequest:
      properties:
        alias:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoExpediente'
        motivo:
          type: string
        tipoCasoId:
          type: string
      type: object
    CatalogDepartamento:
      properties:
        codigo:
          type: string
        id:
          type: string
        nombre:
          type: string
      type: object
    CatalogFinalidad:
      properties:
        id:
          type: string
        nombre:
          type: string
        obligatoria:
          type: boolean
      type: object
    CatalogInstitucion:
      properties:
        id:
          type: string
        nombre:
          type: string
      type: object
    CatalogInstitucionDestino:
      properties:
        id:
          type: string
        nombre:
          type: string
        telefono:
          type: string
      type: object
    CatalogOpcion:
      properties:
        codigo:
          type: string
        nombre:
          type: string
      type: object
    CatalogResponse:
      properties:
        departamentos:
          items:
            $ref: '#/components/schemas/CatalogDepartamento'
          type: array
        finalidadesConsentimiento:
          items:
            $ref: '#/components/schemas/CatalogFinalidad'
          type: array
        institucionesDestino:
          items:
            $ref: '#/components/schemas/CatalogInstitucionDestino'
          type: array
        institucionesOrigen:
          items:
            $ref: '#/components/schemas/CatalogInstitucion'
          type: array
        motivosRevelacion:
          items:
            type: string
          type: array
        origenesContacto:
          items:
            $ref: '#/components/schemas/CatalogOpcion'
          type: array
        sectores:
          items:
            $ref: '#/components/schemas/CatalogSector'
          type: array
        tiposCaso:
          items:
            $ref: '#/components/schemas/CatalogTipoCaso'
          type: array
        vacantes:
          $ref: '#/components/schemas/CatalogVacantes'
      type: object
    CatalogSector:
      properties:
        ageb:
          type: string
        id:
          type: string
        nombre:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoSector'
      type: object
    CatalogTipoCaso:
      properties:
        id:
          type: string
        nombre:
          type: string
      type: object
    CatalogVacantes:
      properties:
        escolaridad:
          items:
            type: string
          type: array
        habilidades:
          items:
            type: string
          type: array
        horario:
          items:
            type: string
          type: array
        inicio:
          items:
            type: string
          type: array
        motivosNoSeleccion:
          items:
            type: string
          type: array
        sector:
          items:
            type: string
          type: array
        tiempoExperiencia:
          items:
            type: string
          type: array
        tipoEmpleo:
          items:
            type: string
          type: array
        ubicacion:
          items:
            type: string
          type: array
      type: object
    CourseAsistencia:
      properties:
        alias:
          example: Participante 01
          type: string
        enrollmentId:
          type: string
        presente:
          type: boolean
      type: object
    CourseCreateRequest:
      properties:
        cupo:
          example: 25
          type: integer
        descripcion:
          type: string
        fecha:
          example: "2026-12-12"
          type: string
        hora:
          example: "17:00"
          type: string
        lugar:
          type: string
        tipo:
          allOf:
            - $ref: '#/components/schemas/TipoCurso'
          enum:
            - curso
            - charla
            - conferencia
        titulo:
          type: string
      type: object
    CourseCurso:
      properties:
        cupo:
          example: 25
          type: integer
        descripcion:
          type: string
        fecha:
          description: AAAA-MM-DD
          example: "2026-12-12"
          type: string
        hora:
          description: HH:MM
          example: "17:00"
          type: string
        id:
          type: string
        inscrita:
          description: Inscrita solo se llena con sesión de usuaria.
          type: boolean
        inscritas:
          example: 18
          type: integer
        lugar:
          example: Sala 2, Los Mochis
          type: string
        tipo:
          allOf:
            - $ref: '#/components/schemas/TipoCurso'
          enum:
            - curso
            - charla
            - conferencia
        titulo:
          example: Finanzas para tu negocio
          type: string
      type: object
    CourseMarcaAsistencia:
      properties:
        enrollmentId:
          type: string
        presente:
          type: boolean
      type: object
    CoursePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CourseCurso'
          type: array
        nextCursor:
          type: string
      type: object
    DecisionConsentimiento:
      enum:
        - aceptado
        - rechazado
      type: string
      x-enum-varnames:
        - DecisionAceptado
        - DecisionRechazado
    EnrollMFARequest:
      properties:
        challengeId:
          type: string
      type: object
    ErrorDetail:
      properties:
        code:
          example: validation_failed
          type: string
        fields:
          additionalProperties:
            type: string
          description: 'Fields solo viene en 422: campo -> código (p. ej. "formato_invalido").'
          type: object
        message:
          example: alias debe tener entre 1 y 100 caracteres
          type: string
        requestId:
          example: 6f1c2f7e-6f3f-4f0e-9f3a-2b1d4c5e6f70
          type: string
      type: object
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
    EstadoCanalizacion:
      enum:
        - pendiente
        - aceptada
        - rechazada
        - cancelada
        - completada
      type: string
      x-enum-varnames:
        - CanalizacionPendiente
        - CanalizacionAceptada
        - CanalizacionRechazada
        - CanalizacionCancelada
        - CanalizacionCompletada
    EstadoExpediente:
      enum:
        - abierto
        - en_seguimiento
        - cerrado
      type: string
      x-enum-varnames:
        - ExpedienteAbierto
        - ExpedienteEnSeguimiento
        - ExpedienteCerrado
    EstadoPersonal:
      enum:
        - activo
        - suspendido
      type: string
      x-enum-varnames:
        - PersonalActivo
        - PersonalSuspendido
    EstadoSolicitudVinculacion:
      enum:
        - pendiente
        - aprobada
        - rechazada
      type: string
      x-enum-varnames:
        - SolicitudPendiente
        - SolicitudAprobada
        - SolicitudRechazada
    EstadoVisita:
      enum:
        - planeada
        - realizada
      type: string
      x-enum-varnames:
        - VisitaPlaneada
        - VisitaRealizada
    HealthResponse:
      properties:
        status:
          example: OK
          type: string
        time:
          example: "2026-01-02T15:04:05Z"
          type: string
      type: object
    HelpEventCreateRequest:
      properties:
        accion:
          example: dialer_opened
          type: string
        contactId:
          type: string
        ocurridoEn:
          example: "2026-11-26T17:42:00Z"
          type: string
        operationId:
          type: string
      type: object
    InstitutionalContactContact:
      properties:
        descripcion:
          example: Si estás en peligro inmediato
          type: string
        horario:
          example: 24 horas
          type: string
        id:
          type: string
        nombre:
          example: Emergencias
          type: string
        prioritario:
          type: boolean
        telefono:
          example: "911"
          type: string
      type: object
    LoginRequest:
      properties:
        password:
          example: ••••••••••••
          type: string
        usuario:
          example: lramos
          type: string
      type: object
    ModalidadConsentimiento:
      enum:
        - presencial
        - digital
      type: string
      x-enum-varnames:
        - ModalidadPresencial
        - ModalidadDigital
    NoteSyncNote:
      properties:
        baseVersionTag:
          description: BaseVersionTag es el versionTag del expediente cuando se escribió el borrador.
          type: string
        corrigeNotaId:
          type: string
        departmentId:
          type: string
        ocurridoEn:
          type: string
        operationId:
          example: 7d1f4c1e-5d9a-4f4f-8a43-2f3b4c5d6e7f
          type: string
        recordId:
          type: string
        texto:
          type: string
      type: object
    NoteSyncRequest:
      properties:
        notes:
          items:
            $ref: '#/components/schemas/NoteSyncNote'
          type: array
      type: object
    NoteSyncResponse:
      properties:
        results:
          items:
            $ref: '#/components/schemas/NoteSyncResult'
          type: array
      type: object
    NoteSyncResult:
      properties:
        noteId:
          type: string
        operationId:
          type: string
        reason:
          example: record_closed
          type: string
        result:
          enum:
            - applied
            - blocked
            - conflict
            - retryable
          type: string
      type: object
    OrigenContacto:
      enum:
        - presencial
        - institucion
        - linea_atencion
        - patrulla_genero
        - emergencia_referida
      type: string
      x-enum-varnames:
        - OrigenPresencial
        - OrigenInstitucion
        - OrigenLineaAtencion
        - OrigenPatrullaGenero
        - OrigenEmergenciaReferida
    OutreachCreateRequest:
      properties:
        fecha:
          example: "2026-12-03"
          type: string
        sectorId:
          type: string
        tema:
          type: string
      type: object
    OutreachPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/OutreachVisita'
          type: array
        nextCursor:
          type: string
      type: object
    OutreachVisita:
      properties:
        estado:
          allOf:
            - $ref: '#/components/schemas/EstadoVisita'
          enum:
            - planeada
            - realizada
        fecha:
          example: "2026-12-03"
          type: string
        id:
          type: string
        responsable:
          example: Capacitación
          type: string
        sector:
          example: Sector 12
          type: string
        sectorId:
          type: string
        tema:
          example: Prevención de la violencia en el noviazgo
          type: string
      type: object
    ReferralDestino:
      properties:
        departamentoId:
          type: string
        institucionId:
          type: string
        nombre:
          type: string
      type: object
    ReferralOrigen:
      properties:
        departamentoId:
          type: string
        nombre:
          type: string
      type: object
    ReferralPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReferralView'
          type: array
        nextCursor:
          type: string
      type: object
    ReferralTransitionRequest:
      properties:
        accion:
          enum:
            - aceptar
            - rechazar
            - completar
            - cancelar
          type: string
        motivo:
          description: 10 a 500; obligatorio en rechazar y cancelar
          type: string
      type: object
    ReferralView:
      properties:
        alias:
          type: string
        createdAt:
          type: string
        destino:
          $ref: '#/components/schemas/ReferralDestino'
        estado:
          $ref: '#/components/schemas/EstadoCanalizacion'
        expedienteId:
          type: string
        id:
          type: string
        motivo:
          description: del último rechazo o cancelación
          type: string
        origen:
          $ref: '#/components/schemas/ReferralOrigen'
        resumen:
          type: string
        tipo:
          $ref: '#/components/schemas/TipoCanalizacion'
        versionTag:
          type: string
      type: object
    ResultadoAuditoria:
      enum:
        - exito
        - denegado
        - error
        - intento_entrega
      type: string
      x-enum-varnames:
        - ResultadoExito
        - ResultadoDenegado
        - ResultadoError
        - ResultadoIntentoEntrega
    StatusDatabase:
      properties:
        error:
          example: 'dial tcp: connection refused'
          type: string
        latency_ms:
          example: 3
          type: integer
        status:
          example: ok
          type: string
      type: object
    StatusResponse:
      properties:
        database:
          $ref: '#/components/schemas/StatusDatabase'
        service:
          example: backend-hackathon
          type: string
        status:
          example: ok
          type: string
        uptime_seconds:
          example: 120
          type: integer
        version:
          example: dev
          type: string
      type: object
    SurveyConteo:
      properties:
        opcion:
          example: Sí
          type: string
        total:
          example: 30
          type: integer
      type: object
    SurveyPregunta:
      properties:
        conteo:
          items:
            $ref: '#/components/schemas/SurveyConteo'
          type: array
        id:
          example: p1
          type: string
        promedio:
          example: 4.3
          type: number
        texto:
          type: string
        tipo:
          allOf:
            - $ref: '#/components/schemas/TipoPregunta'
          enum:
            - escala
            - opcion
            - abierta
      type: object
    SurveyResultado:
      properties:
        encuestaId:
          type: string
        preguntas:
          items:
            $ref: '#/components/schemas/SurveyPregunta'
          type: array
        respuestas:
          example: 37
          type: integer
        titulo:
          example: ¿Cómo te atendimos?
          type: string
      type: object
    TipoCanalizacion:
      enum:
        - interna
        - externa
      type: string
      x-enum-comments:
        CanalizacionExternaTipo: a una institución de catalogos.instituciones
        CanalizacionInternaTipo: a otro departamento
      x-enum-descriptions:
        - a otro departamento
        - a una institución de catalogos.instituciones
      x-enum-varnames:
        - CanalizacionInternaTipo
        - CanalizacionExternaTipo
    TipoCurso:
      enum:
        - curso
        - charla
        - conferencia
      type: string
      x-enum-varnames:
        - CursoCurso
        - CursoCharla
        - CursoConferencia
    TipoPregunta:
      enum:
        - escala
        - opcion
        - abierta
      type: string
      x-enum-comments:
        PreguntaEscala: 1 a 5
      x-enum-descriptions:
        - 1 a 5
        - ""
        - ""
      x-enum-varnames:
        - PreguntaEscala
        - PreguntaOpcion
        - PreguntaAbierta
    TipoSector:
      enum:
        - sector
        - colonia
        - sindicatura
      type: string
      x-enum-varnames:
        - SectorSector
        - SectorColonia
        - SectorSindicatura
    UserActivacion:
      properties:
        codigo:
          example: K7P2-9QX4
          type: string
        expiresAt:
          type: string
      type: object
    UserActor:
      properties:
        departmentId:
          type: string
        displayName:
          type: string
        id:
          type: string
        permissions:
          items:
            type: string
          type: array
        rol:
          type: string
      type: object
    UserCreateRequest:
      properties:
        departamentoId:
          type: string
        nombreLaboral:
          type: string
        rol:
          type: string
        usuario:
          type: string
      type: object
    UserCreateResponse:
      properties:
        activacion:
          $ref: '#/components/schemas/UserActivacion'
        cuenta:
          $ref: '#/components/schemas/UserStaffSummary'
      type: object
    UserMFAResetRequest:
      properties:
        motivo:
          type: string
        verificacionPresencial:
          type: boolean
      type: object
    UserMeResponse:
      properties:
        actor:
          $ref: '#/components/schemas/UserActor'
        expiresAt:
          type: string
        idleExpiresAt:
          type: string
      type: object
    UserPageStaffSummary:
      properties:
        items:
          items:
            $ref: '#/components/schemas/UserStaffSummary'
          type: array
        nextCursor:
          type: string
      type: object
    UserRevokeSessionsRequest:
      properties:
        motivo:
          type: string
      type: object
    UserSessionSummary:
      properties:
        createdAt:
          type: string
        current:
          type: boolean
        deviceLabel:
          type: string
        expiresAt:
          type: string
        id:
          type: string
        lastActivityAt:
          type: string
      type: object
    UserStaffSummary:
      properties:
        departamentoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPersonal'
        id:
          type: string
        nombreLaboral:
          type: string
        rol:
          type: string
        ultimoAcceso:
          type: string
        usuario:
          type: string
        versionTag:
          type: string
      type: object
    UserUpdateRequest:
      properties:
        departamentoId:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoPersonal'
        rol:
          type: string
      type: object
    VerifyMFARequest:
      properties:
        challengeId:
          type: string
        code:
          example: "123456"
          type: string
        enrollmentId:
          type: string
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      description: JWT de POST /auth/login. Las escrituras exigen además X-CSRF-Token (csrf_token del login o GET /auth/csrf-token).
      scheme: bearer
      type: http
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
openapi: 3.0.3
paths:
  /analytics/heatmap:
    get:
      description: Nivel de 1 a 5 por quintiles entre los AGEB con 5 o más expedientes abiertos en el periodo, o "suprimido" si tienen menos. Nunca el conteo exacto ni puntos domiciliarios. Requiere analytics.heatmap.
      parameters:
        - description: 30d (por defecto) | 6m | 12m
          in: query
          name: period
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsHeatmap'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - BearerAuth: []
      summary: Mapa de calor por AGEB
      tags:
        - analytics
  /analytics/summary:
    get:
      description: Expedientes abiertos y canalizaciones del periodo (con su cambio frente al periodo anterior), por mes, por origen de contacto y por área. El corte es la medianoche de hoy en Los Mochis. Las cifras menores a 5 llegan en null con suprimido=true. Requiere analytics.read.
      parameters:
        - description: 30d (por defecto) | 6m | 12m
          in: query
          name: period
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsSummary'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - BearerAuth: []
      summary: Indicadores del tablero
      tags:
        - analytics
  /audit-logs:
    get:
      description: 'Eventos del más reciente al más antiguo: actor, rol, acción, expediente, resultado y detalle (por ejemplo, el campo revelado y el motivo). Nunca incluye la IP ni valores sensibles. La consulta queda en la bitácora. Requiere auditlog.read.'
      parameters:
        - description: UUID del actor
          in: query
          name: actorId
          schema:
            type: string
        - description: UUID del expediente
          in: query
          name: recordId
          schema:
            type: string
        - description: Acción exacta, p. ej. casefile.disclose.telefono
          in: query
          name: action
          schema:
            type: string
        - description: Desde (RFC 3339)
          in: query
          name: from
          schema:
            type: string
        - description: Hasta (RFC 3339, exclusivo)
          in: query
          name: to
          schema:
            type: string
        - description: 1..100 (20 por defecto)
          in: query
          name: limit
          schema:
            type: integer
        - description: Cursor opaco
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - BearerAuth: []
      summary: Consultar bitácora
      tags:
        - audit
  /auth/activations:
    post:
      description: La persona elige su contraseña con el código que TI le entregó al crear la cuenta (POST /users). El código es de un solo uso y vence a las 72 h. Después entra con POST /auth/login y configura su segundo factor. Pública, sin CSRF. No revela si el usuario existe.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequest'
        description: Usuario, código y contraseña nueva
        required: true
        x-originalParamName: request
      responses:
        "204":
          description: Contraseña fijada
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_code
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: validation_failed (contraseña de 12 a 128 caracteres)
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: too_many_attempts
      summary: Activar cuenta
      tags:
        - auth
  /auth/csrf-token:
    get:
      description: Genera un token CSRF nuevo para la sesión e invalida el anterior. La pantalla lo pide al recargar con una sesión viva.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCSRFResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - BearerAuth: []
      summary: Obtener token CSRF
      tags:
        - auth
  /auth/login:
    post:
      description: 'Valida usuario y contraseña con límite de 5 fallos en 15 min. Responde siempre 202 con un reto: next=totp si la cuenta ya tiene segundo factor, next=enroll si debe configurarlo. Nadie entra sin segundo factor. Pública, sin CSRF.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        description: Credenciales
        required: true
        x-originalParamName: request
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthChallenge'
          description: Accepted
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_credentials (no revela si el usuario existe)
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: account_suspended
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: too_many_attempts, con Retry-After
      summary: Iniciar sesión (paso 1)
      tags:
        - auth
  /auth/logout:
    post:
      description: Revoca la sesión actual y expira la cookie sai_staff (Max-Age=0). Es idempotente.
      parameters:
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Sin contenido
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: csrf_invalid
      security:
        - BearerAuth: []
      summary: Cerrar sesión
      tags:
        - auth
  /auth/me:
    get:
      description: Misma información que el campo usuario de la sesión. El frontend usa GET /users/me.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUsuarioInfo'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
      security:
        - BearerAuth: []
      summary: Cuenta autenticada (legado)
      tags:
        - auth
  /auth/mfa/enrollments:
    post:
      description: Con el challengeId de un login con next=enroll genera el secreto TOTP. otpauthUri se muestra una sola vez; después se confirma con POST /auth/mfa/verify enviando enrollmentId. Pública, sin CSRF.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollMFARequest'
        description: Reto del login
        required: true
        x-originalParamName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthEnrollmentResult'
          description: Created
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: mfa_already_enrolled
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: challenge_expired
      summary: Configurar segundo factor
      tags:
        - auth
  /auth/mfa/verify:
    post:
      description: Valida el código del reto. Si el reto es de enrolamiento, enrollmentId es obligatorio y activa el segundo factor. Responde la sesión y pone la cookie sai_staff (HttpOnly, Secure, SameSite=Strict, Path=/api). El csrfToken se guarda solo en memoria. Pública, sin CSRF.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMFARequest'
        description: Reto y código
        required: true
        x-originalParamName: request
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: OK
          headers:
            Set-Cookie:
              description: sai_staff=<jwt>; HttpOnly; Secure; SameSite=Strict; Path=/api
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: invalid_code
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: challenge_expired
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: too_many_attempts
      summary: Verificar segundo factor (paso 2)
      tags:
        - auth
  /case-access-requests:
    get:
      description: 'Solicitudes de la más antigua a la más reciente. Solo metadatos y el motivo: nunca datos de identidad de la persona ni notas. La consulta queda en la bitácora. Requiere caseaccess.review.'
      parameters:
        - description: pendiente | aprobada | rechazada
          in: query
          name: status
          schema:
            type: string
        - description: 1..100 (20 por defecto)
          in: query
          name: limit
          schema:
            type: integer
        - description: Cursor opaco
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAccessRequestPage'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - BearerAuth: []
      summary: Bandeja de solicitudes de acceso
      tags:
        - case-access-requests
    post:
      description: Con el linkToken que devolvió POST /case-files/duplicate-checks, sin volver a enviar la CURP. El token es de un solo uso y solo sirve a quien lo pidió. Coordinación decide en la bandeja sin ver el expediente. Requiere caseaccess.request.
      parameters:
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
        - description: UUID de la operación
          in: header
          name: Idempotency-Key
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseAccessRequestCreateRequest'
        description: Token y motivo (10 a 500 caracteres)
        required: true
        x-originalParamName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAccessRequestCreated'
          description: Created
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'not_found: token inexistente o de otra persona'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: request_exists
        "410":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: link_expired
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: validation_failed con fields
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: encryption_unavailable
      security:
        - BearerAuth: []
      summary: Solicitar acceso a un expediente
      tags:
        - case-access-requests
  /case-access-requests/{id}/rejection:
    post:
      description: Rechaza una solicitud pendiente. Para aprobarla se asigna con solicitudId en POST /case-files/{recordId}/assignments. Requiere caseaccess.review.
      parameters:
        - description: UUID de la solicitud
          in: path
          name: id
          required: true
          schema:
            type: string
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseAccessRequestRejectRequest'
        description: Motivo (10 a 500 caracteres)
        required: true
        x-originalParamName: request
      responses:
        "204":
          description: Rechazada
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: request_not_pending
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
      security:
        - BearerAuth: []
      summary: Rechazar solicitud de acceso
      tags:
        - case-access-requests
  /case-files:
    get:
      description: Solo los expedientes asignados al actor, con las áreas que tienen asignación vigente. Sin búsqueda por nombre ni CURP, a propósito.
      parameters:
        - description: Tamaño de página (1-100, default 20)
          in: query
          name: limit
          schema:
            type: integer
        - description: Cursor de paginación
          in: query
          name: cursor
          schema:
            type: string
        - description: abierto | en_seguimiento | cerrado
          in: query
          name: status
          schema:
            type: string
        - description: updatedAt desde (RFC 3339)
          in: query
          name: from
          schema:
            type: string
        - description: updatedAt hasta (RFC 3339, exclusivo)
          in: query
          name: to
          schema:
            type: string
        - description: Alias de búsqueda
          in: query
          name: alias
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasefilePageSummary'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
        - BearerAuth: []
      summary: Listar expedientes
      tags:
        - case-files
    post:
      description: Crea un expediente nuevo con Idempotency-Key (X-Operation-Id como alias). Repetir la clave en 24 h devuelve la misma respuesta; con otro cuerpo responde 409 idempotency_mismatch.
      parameters:
        - description: UUID de operación idempotente
          in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
        - description: Token CSRF de la sesión
          in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CasefileCreateRequest'
        description: Datos del expediente
        required: true
        x-originalParamName: request
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CasefileDetail'
          description: Created
          headers:
            ETag:
              description: Versión actual del recurso
              schema:
                type: string
            Location:
              description: /api/v1/case-files/{id}
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: person_exists, con linkToken, linkExpiresAt y department junto a error
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
        - BearerAuth: []
      summary: Crear expediente
      tags:
        - case-files
  /case-files/{recordId}:
    get:
      description: Encabezado y resumen del expediente con sector, edad (nunca la fecha de nacimiento), áreas y los datos sensibles ya enmascarados en ocultos. 404 si no existe o no está asignado al actor. Devuelve ETag.
      parameters:
        - description: UUID del expediente
          in: path
          name: recordId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
