        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar bitácora
      tags:
