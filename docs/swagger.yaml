        sin puntos domiciliarios. Sin filtros puede haber varias filas por sector
        (una por mes y tipo). Requiere analytics.read. API-038.
      parameters:
      - description: Mes en formato YYYY-MM
        in: query
        name: period
        type: string
      - description: UUID del tipo de caso
        in: query
        name: caseTypeId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models_analytics.Heatmap'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mapa de calor por sector
      tags:
      - analytics
  /analytics/summary:
    get:
      description: Personas y episodios por sector, tipo de caso y mes. Las celdas
        con menos de 5 casos llegan en null con suprimido=true. Requiere analytics.read.
        API-037.
      parameters:
      - description: Desde (RFC 3339), sobre el mes del episodio
        in: query
        name: from
        type: string
      - description: Hasta (RFC 3339, exclusivo)
        in: query
        name: to
        type: string
      - description: UUID del sector
        in: query
        name: sectorId
        type: string
      - description: UUID del tipo de caso
        in: query
        name: caseTypeId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models_analytics.Summary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resumen de indicadores
      tags:
      - analytics
  /audit-alerts:
