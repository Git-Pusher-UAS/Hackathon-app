      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models.Vacante'
      summary: Revisar vacante (admin)
      tags:
      - admin-jobs
  /analytics/heatmap:
    get:
      description: Devuelve celdas por sector con supresión k<5.
      parameters:
      - description: Fecha/hora inicial
        in: query
        name: from
        type: string
      - description: Fecha/hora final
        in: query
        name: to
        type: string
      - description: Tipo de caso (UUID)
        in: query
        name: type
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend-hackathon_internal_models_analytics.HeatmapCell'
