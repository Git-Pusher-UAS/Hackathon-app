host: localhost:3000
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
paths:
  /admin/applications/{id}/contact-release:
    post:
      consumes:
      - application/json
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Motivo y campos
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bolsaextra.ContactReleaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models.Postulacion'
      summary: Liberar contacto de postulación
      tags:
      - admin-jobs
  /admin/employers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend-hackathon_internal_models.Empleador'
            type: array
      summary: Listar empleadores (admin)
      tags:
      - admin-jobs
  /admin/employers/{id}/review:
    post:
      consumes:
      - application/json
      parameters:
      - description: Employer ID
        in: path
        name: id
        required: true
        type: string
      - description: Decisión
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bolsaextra.AdminReviewRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models.Empleador'
      summary: Revisar empleador (admin)
      tags:
      - admin-jobs
  /admin/hires:
