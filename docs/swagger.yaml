        in: query
        name: result
        type: string
      - description: Desde (RFC 3339, inclusive)
        in: query
        name: from
        type: string
      - description: Hasta (RFC 3339, exclusivo)
        in: query
        name: to
        type: string
      - description: 1..100 (20 por defecto)
        in: query
        name: limit
        type: integer
      - description: Cursor opaco de la página anterior
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
