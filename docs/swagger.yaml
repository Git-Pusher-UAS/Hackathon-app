        in: query
        name: status
        type: string
      - description: media | alta
        in: query
        name: level
        type: string
      - description: UUID del actor observado
        in: query
        name: actorId
        type: string
      - description: Desde (RFC 3339)
        in: query
        name: from
        type: string
      - description: Hasta (RFC 3339)
        in: query
        name: to
        type: string
      - description: 1..100 (20 por defecto)
        in: query
        name: limit
        type: integer
      - description: Cursor opaco
        in: query
        name: cursor
        type: string
