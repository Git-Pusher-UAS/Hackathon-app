      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend-hackathon_internal_models.Postulacion'
            type: array
      summary: Listar contrataciones
      tags:
      - admin-jobs
  /admin/jobs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/backend-hackathon_internal_models.Vacante'
            type: array
      summary: Listar vacantes (admin)
      tags:
      - admin-jobs
    post:
      consumes:
      - application/json
      parameters:
      - description: Vacante
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers_bolsaextra.AdminJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models.Vacante'
      summary: Crear vacante (admin)
      tags:
      - admin-jobs
  /admin/jobs/{id}:
    get:
      parameters:
      - description: Job ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models.Vacante'
      summary: Obtener vacante (admin)
      tags:
      - admin-jobs
  /admin/jobs/{id}/review:
    post:
      consumes:
      - application/json
      parameters:
      - description: Job ID
