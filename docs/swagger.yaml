basePath: /api
definitions:
  backend-hackathon_internal_auth.CSRFResult:
    properties:
      csrf_token:
        type: string
    type: object
  backend-hackathon_internal_auth.EnrollmentResult:
    properties:
      otpauth_url:
        type: string
      secret:
        type: string
    type: object
  backend-hackathon_internal_auth.LoginResult:
    properties:
      csrf_token:
        type: string
      expires_in:
        type: integer
      token:
        type: string
      token_type:
        type: string
      usuario:
        $ref: '#/definitions/backend-hackathon_internal_auth.UsuarioInfo'
    type: object
  backend-hackathon_internal_auth.MFAChallengeResponse:
    properties:
      challenge_token:
        type: string
      error:
        example: mfa_requerido
        type: string
    type: object
  backend-hackathon_internal_auth.UsuarioInfo:
    properties:
      id:
        type: string
      nombre_laboral:
        type: string
      permisos:
        items:
          type: string
        type: array
      requiere_cambio_password:
        type: boolean
      rol:
        type: string
      usuario:
        type: string
    type: object
  backend-hackathon_internal_auth.VerifyMFAResult:
    properties:
      activado:
        type: boolean
      login:
        $ref: '#/definitions/backend-hackathon_internal_auth.LoginResult'
    type: object
  internal_handlers.ErrorResponse:
    properties:
      error:
        example: error interno
        type: string
    type: object
  internal_handlers.HealthResponse:
    properties:
      status:
        example: OK
        type: string
      time:
        example: "2026-01-02T15:04:05Z"
        type: string
    type: object
  internal_handlers.LoginRequest:
    properties:
      password:
        example: admin123
        type: string
      usuario:
        example: admin
        type: string
    type: object
  internal_handlers.StatusDatabase:
    properties:
      error:
        example: 'dial tcp: connection refused'
        type: string
      latency_ms:
        example: 3
        type: integer
      status:
        example: ok
        type: string
    type: object
  internal_handlers.StatusResponse:
    properties:
      database:
        $ref: '#/definitions/internal_handlers.StatusDatabase'
      service:
        example: backend-hackathon
        type: string
      status:
        example: ok
        type: string
      uptime_seconds:
        example: 120
        type: integer
      version:
        example: dev
        type: string
    type: object
  internal_handlers.VerifyMFARequest:
    properties:
      challenge_token:
        type: string
      code:
        example: "123456"
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
paths:
  /auth/csrf-token:
    get:
      description: Genera un token CSRF nuevo para la sesión autenticada e invalida
        el anterior.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.CSRFResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener token CSRF
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida usuario y contraseña, aplica rate limit y crea una sesión
        revocable. Si la cuenta tiene MFA activo devuelve un challenge_token.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.MFAChallengeResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Iniciar sesión
      tags:
      - auth
  /auth/logout:
    post:
      description: Revoca la sesión asociada al token actual. Es idempotente.
      produces:
      - application/json
      responses:
        "204":
          description: Sin contenido
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cerrar sesión
      tags:
      - auth
  /auth/me:
    get:
      description: Devuelve la cuenta del portador del token y sus permisos efectivos.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.UsuarioInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cuenta autenticada
      tags:
      - auth
  /auth/mfa/enrollments:
    post:
      description: Genera el secreto TOTP y la URL otpauth para escanear con una app
        autenticadora.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.EnrollmentResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Iniciar enrolamiento MFA
      tags:
      - auth
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: Con Bearer confirma el enrolamiento; con challenge_token completa
        el login y devuelve la sesión.
      parameters:
      - description: Código y challenge opcional
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.VerifyMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.VerifyMFAResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handlers.ErrorResponse'
      summary: Verificar código MFA
      tags:
      - auth
  /health:
    get:
      description: Comprueba que el proceso está vivo. Se sirve en la raíz, fuera
        de /api.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /status:
    get:
      description: Comprueba la conexión con la base de datos y devuelve el estado
        del servicio.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.StatusResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/internal_handlers.StatusResponse'
      summary: Readiness probe
      tags:
      - status
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
