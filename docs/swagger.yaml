        type: string
      - description: Fecha/hora inicial
        in: query
        name: from
        type: string
      - description: Fecha/hora final
        in: query
        name: to
        type: string
      - description: Tipo de caso (UUID)
        in: query
        name: type
        type: string
      - description: Estado del expediente
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_models_analytics.Summary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Resumen analítico
      tags:
