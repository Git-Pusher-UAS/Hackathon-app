host: localhost:3000
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
paths:
  /auth/activations:
    post:
      consumes:
      - application/json
      description: La persona elige su contraseña con el código que TI le entregó
        al crear la cuenta (POST /users). El código es de un solo uso y vence a las
        72 h. Después entra con POST /auth/login y configura su segundo factor. Pública,
        sin CSRF. No revela si el usuario existe.
      parameters:
      - description: Usuario, código y contraseña nueva
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.ActivationRequest'
      responses:
        "204":
          description: Contraseña fijada
        "401":
          description: invalid_code
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: validation_failed (contraseña de 12 a 128 caracteres)
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "429":
          description: too_many_attempts
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Activar cuenta
      tags:
      - auth
  /auth/csrf-token:
    get:
      description: Genera un token CSRF nuevo para la sesión e invalida el anterior.
        La pantalla lo pide al recargar con una sesión viva.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.CSRFResult'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Obtener token CSRF
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 'Valida usuario y contraseña con límite de 5 fallos en 15 min.
        Responde siempre 202 con un reto: next=totp si la cuenta ya tiene segundo
        factor, next=enroll si debe configurarlo. Nadie entra sin segundo factor.
        Pública, sin CSRF.'
      parameters:
      - description: Credenciales
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.Challenge'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: invalid_credentials (no revela si el usuario existe)
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: account_suspended
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "429":
          description: too_many_attempts, con Retry-After
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Iniciar sesión (paso 1)
      tags:
      - auth
  /auth/logout:
    post:
      description: Revoca la sesión actual y expira la cookie sai_staff (Max-Age=0).
        Es idempotente.
      parameters:
      - description: Token CSRF de la sesión
        in: header
        name: X-CSRF-Token
        required: true
        type: string
      responses:
        "204":
          description: Sin contenido
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: csrf_invalid
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cerrar sesión
      tags:
      - auth
  /auth/me:
    get:
      description: Misma información que el campo usuario de la sesión. El frontend
        usa GET /users/me.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.UsuarioInfo'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Cuenta autenticada (legado)
      tags:
      - auth
  /auth/mfa/enrollments:
    post:
      consumes:
      - application/json
      description: Con el challengeId de un login con next=enroll genera el secreto
        TOTP. otpauthUri se muestra una sola vez; después se confirma con POST /auth/mfa/verify
        enviando enrollmentId. Pública, sin CSRF.
      parameters:
      - description: Reto del login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.EnrollMFARequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.EnrollmentResult'
        "409":
          description: mfa_already_enrolled
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "410":
          description: challenge_expired
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Configurar segundo factor
      tags:
      - auth
  /auth/mfa/verify:
    post:
      consumes:
      - application/json
      description: Valida el código del reto. Si el reto es de enrolamiento, enrollmentId
        es obligatorio y activa el segundo factor. Responde la sesión y pone la cookie
        sai_staff (HttpOnly, Secure, SameSite=Strict, Path=/api). El csrfToken se
        guarda solo en memoria. Pública, sin CSRF.
      parameters:
      - description: Reto y código
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.VerifyMFARequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Set-Cookie:
              description: sai_staff=<jwt>; HttpOnly; Secure; SameSite=Strict; Path=/api
              type: string
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.Session'
        "401":
          description: invalid_code
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "410":
          description: challenge_expired
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "429":
          description: too_many_attempts
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Verificar segundo factor (paso 2)
      tags:
      - auth
