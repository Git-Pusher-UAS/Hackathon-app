  /auth/login:
    post:
      consumes:
      - application/json
      description: Valida usuario y contraseña, aplica rate limit y crea una sesión
        revocable. Si la cuenta tiene MFA activo devuelve un challenge_token.
      parameters:
      - description: Credenciales de acceso
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.LoginResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/backend-hackathon_internal_auth.MFAChallengeResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
