host: localhost:3000
info:
  contact: {}
  description: Documentación de endpoints de la API.
  title: SAI API
  version: "1.0"
paths:
  /api/v1/case-files:
    get:
      description: Obtiene una página de expedientes filtrable por estado y alias.
      parameters:
      - description: Tamaño de página (1-100, default 20)
        in: query
        name: limit
        type: integer
      - description: Cursor de paginación
        in: query
        name: cursor
        type: string
      - description: Estado del expediente
        in: query
        name: estado
        type: string
      - description: Alias de búsqueda
        in: query
        name: alias
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Listar expedientes
      tags:
      - case-files
    post:
      consumes:
      - application/json
      description: Crea un expediente nuevo requiriendo X-Operation-Id para idempotencia.
      parameters:
      - description: UUID de operación idempotente
        in: header
        name: X-Operation-Id
        required: true
        type: string
      - description: Datos del expediente
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend-hackathon_internal_models_casefile.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          headers:
            ETag:
              description: Versión actual del recurso
              type: string
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Crear expediente
      tags:
      - case-files
  /api/v1/case-files/{recordId}:
    get:
      description: Devuelve los datos de un expediente por recordId y su cabecera
        ETag.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Versión actual del recurso
              type: string
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Obtener expediente
      tags:
      - case-files
    patch:
      consumes:
      - application/json
      description: Actualiza un expediente requiriendo la cabecera If-Match con la
        versión esperada.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      - description: ETag / versión actual del recurso
        in: header
        name: If-Match
        required: true
        type: string
      - description: Campos a actualizar
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend-hackathon_internal_models_casefile.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            ETag:
              description: Nueva versión del recurso
              type: string
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "412":
          description: Precondition Failed
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Actualizar expediente
      tags:
      - case-files
  /api/v1/case-files/{recordId}/assignments:
    post:
      consumes:
      - application/json
      description: Crea una asignación activa sobre el expediente indicado.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      - description: Datos de asignación
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend-hackathon_internal_models_casefile.AssignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Asignar personal al expediente
      tags:
      - case-files-assignments
  /api/v1/case-files/{recordId}/assignments/{assignmentId}:
    delete:
      description: Revoca una asignación específica dentro de un expediente.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      - description: UUID de la asignación
        in: path
        name: assignmentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            type: string
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Revocar asignación
      tags:
      - case-files-assignments
  /api/v1/case-files/{recordId}/consents:
    get:
      description: Devuelve los consentimientos asociados a un expediente bajo la
        clave items.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      summary: Listar consentimientos
      tags:
      - case-files-consents
    post:
      consumes:
      - application/json
      description: Guarda un consentimiento con cabecera X-Operation-Id opcional.
      parameters:
      - description: UUID del expediente
        in: path
        name: recordId
        required: true
        type: string
      - description: UUID de operación idempotente (opcional)
        in: header
        name: X-Operation-Id
        type: string
      - description: Datos del consentimiento
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/backend-hackathon_internal_models_casefile.ConsentInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
