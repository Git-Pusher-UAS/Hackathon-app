            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Listar alertas de auditoría
      tags:
      - audit-alerts
  /audit-logs:
    get:
      description: Devuelve eventos de auditoría filtrados. La consulta queda registrada
        en la bitácora.
      parameters:
      - description: ID del actor
        in: query
        name: actorId
        type: string
      - description: ID del expediente
        in: query
        name: recordId
        type: string
      - description: Acción
        in: query
        name: action
        type: string
      - description: Fecha/hora inicial (RFC3339 o YYYY-MM-DD)
        in: query
        name: from
        type: string
      - description: Fecha/hora final (RFC3339 o YYYY-MM-DD)
        in: query
        name: to
        type: string
      - description: 1..200
        in: query
        name: limit
        type: integer
      - description: Cursor opaco
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
