          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/backend-hackathon_internal_httpx.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Consultar alertas de acceso
      tags:
      - audit
  /audit-logs:
    get:
      description: Eventos de auditoría, del más reciente al más antiguo. La propia
        consulta queda auditada. Requiere el permiso audit.read. API-035.
      parameters:
      - description: UUID del actor
        in: query
        name: actorId
        type: string
      - description: UUID del recurso afectado (p. ej. expediente)
        in: query
        name: recordId
        type: string
      - description: Acción exacta, p. ej. casefile.disclose.curp
